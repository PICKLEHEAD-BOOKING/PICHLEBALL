<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xác thực OTP - Picklehead Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="XacThuc.css">
</head>
<body data-page="otp">
<main class="auth-card">
  <h1>Xác thực OTP</h1>
  <p class="sub">Mã OTP đã được gửi đến email đăng kí<br><strong id="maskedTarget"></strong></p>
  <form novalidate>
    <div class="field"><label for="otp">Mã OTP</label>
      <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Nhập mã OTP" autocomplete="one-time-code"></div>
    <button class="btn btn-primary" type="submit">Xác thực mã OTP</button>
    <p class="hint">Hơi chờ đủ 3 phút mà vẫn chưa nhận được mã?</p>
    <button class="btn btn-outline" type="button" id="resendBtn">Gửi lại mã OTP</button>
  </form>
  <div class="divider"></div>
  <p class="foot">Cần thay đổi thông tin? <a class="link" data-route="dangNhap">Quay lại Đăng nhập</a></p>
</main>
<script src="Router.js"></script>
<script src="XacThuc.js"></script>
</body>
</html>
