<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - Picklehead Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="XacThuc.css">
</head>
<body data-page="login">
<main class="auth-card">
  <h1>Đăng nhập</h1>
  <p class="sub">Chào mừng bạn trở lại! Vui lòng nhập thông tin để tiếp tục.</p>
  <form novalidate>
    <div class="field"><label class="required" for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Nhập email" autocomplete="email"></div>
    <div class="field"><label class="required" for="password">Mật khẩu</label>
      <div class="input-wrap"><input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password"><button type="button" class="eye" data-toggle-pw></button></div></div>
    <p class="right"><a class="link" data-route="quenMatKhau">Quên mật khẩu</a></p>
    <button class="btn btn-primary" type="submit">Đăng nhập</button>
  </form>
  <div class="divider"></div>
  <p class="foot">Chưa có tài khoản? <a class="link" data-route="dangKy">Đăng ký tài khoản</a></p>
</main>
<script src="Router.js"></script>
<script src="XacThuc.js"></script>
</body>
</html>
