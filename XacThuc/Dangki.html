<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký tài khoản - Picklehead Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="XacThuc.css">
</head>
<body data-page="register">
<main class="auth-card">
  <h1>Đăng ký tài khoản</h1>
  <p class="sub">Tạo tài khoản để tìm và đặt sân thể thao dễ dàng hơn.</p>
  <form novalidate>
    <div class="field"><label class="required" for="email">Email</label>
      <input id="email" name="email" aria-required="true" type="email" placeholder="Nhập email" autocomplete="email"></div>
    <div class="field"><label for="phone">Số điện thoại</label>
      <input id="phone" name="phone" type="tel" placeholder="Số điện thoại" autocomplete="tel"></div>
    <div class="field"><label class="required" for="fullname">Họ và tên</label>
      <input id="fullname" name="fullname" aria-required="true" type="text" placeholder="Nhập họ và tên" autocomplete="name"></div>
    <div class="row-2">
      <div class="field"><label for="birth">Năm sinh</label>
        <input id="birth" name="birth" type="number" placeholder="Nhập năm sinh" min="1900"></div>
      <div class="field"><label for="gender">Giới tính</label>
        <select id="gender" name="gender"><option value="">Chọn giới tính</option><option>Nam</option><option>Nữ</option><option>Khác</option></select></div>
    </div>
    <div class="field"><label class="required" for="password">Mật khẩu</label>
      <div class="input-wrap"><input id="password" name="password" aria-required="true" type="password" placeholder="Nhập mật khẩu" autocomplete="new-password"><button type="button" class="eye" data-toggle-pw></button></div></div>
    <div class="field"><label class="required" for="confirm">Nhập lại mật khẩu</label>
      <div class="input-wrap"><input id="confirm" name="confirm" aria-required="true" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password"><button type="button" class="eye" data-toggle-pw></button></div></div>
    <button class="btn btn-primary" type="submit">Đăng ký</button>
  </form>
  <div class="divider"></div>
  <p class="foot">Đã có tài khoản? <a class="link" data-route="dangNhap">Đăng nhập</a></p>
</main>
<script src="Router.js"></script>
<script src="XacThuc.js"></script>
</body>
</html>
